name: Validar evidências

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependência dos geradores visuais
        run: python3 -m pip install -r requirements.txt
      - name: Baixar os 140 relatórios da release
        run: curl -fL -o lighthouse-json-140-v1.0.0.tar.gz "https://github.com/xndvaz/mba-eca-usp-transformacao-digital/releases/download/v1.0.0/lighthouse-json-140-v1.0.0.tar.gz"
      - name: Conferir o hash do arquivo
        run: shasum -a 256 -c integridade/sha256-arquivo-release.txt
      - name: Extrair e validar
        run: |
          tar -xzf lighthouse-json-140-v1.0.0.tar.gz
          python3 scripts/validar-pacote.py --raw-dir relatorios-json --rebuild
      - name: Regerar tabelas, figuras e resumos
        run: |
          cp -R figuras-geradas /tmp/figuras-publicadas
          python3 scripts/gerar-tabelas-figuras.py
          python3 scripts/gerar-figura-escores.py
          python3 scripts/gerar-resumo-redacao.py
      - name: Comparar artefatos textuais regenerados
        run: git diff --exit-code -- dados/resumo-para-redacao.md dados/tabela-performance.csv figuras-geradas/*.md figuras-geradas/*.svg
      - name: Comparar conteúdo visual das imagens regeneradas
        run: python3 scripts/validar-figuras.py --expected /tmp/figuras-publicadas --actual figuras-geradas
