name: Validar evidências

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-evidencias-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar o Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependência dos geradores visuais
        run: python3 -m pip install --disable-pip-version-check --requirement requirements.txt
      - name: Testar tolerância da comparação visual
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Baixar os 140 relatórios da release
        run: curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --output lighthouse-json-140-v1.0.0.tar.gz "https://github.com/xndvaz/mba-eca-usp-transformacao-digital/releases/download/v1.0.0/lighthouse-json-140-v1.0.0.tar.gz"
      - name: Conferir o hash do arquivo
        run: shasum -a 256 -c integridade/sha256-arquivo-release.txt
      - name: Extrair e validar
        run: |
          tar -xzf lighthouse-json-140-v1.0.0.tar.gz
          python3 scripts/validar-pacote.py --raw-dir relatorios-json --rebuild
      - name: Regerar tabelas, figuras e resumos
        run: |
          cp -R figuras-geradas /tmp/figuras-publicadas
          python3 scripts/gerar-tabelas-figuras.py
          python3 scripts/gerar-figura-escores.py
          python3 scripts/gerar-resumo-redacao.py
      - name: Comparar artefatos textuais regenerados
        run: git diff --exit-code -- dados/resumo-para-redacao.md dados/tabela-performance.csv figuras-geradas/*.md figuras-geradas/*.svg
      - name: Guardar imagens regeneradas para auditoria
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: figuras-regeneradas-${{ github.run_id }}-${{ github.run_attempt }}
          path: figuras-geradas/*.png
          retention-days: 1
      - name: Comparar conteúdo visual das imagens regeneradas
        run: python3 scripts/validar-figuras.py --expected /tmp/figuras-publicadas --actual figuras-geradas
